<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | LinkUp</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           LINKUP LOGIN PAGE
        ========================================= */

        .login-page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 196, 0, 0.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 196, 0, 0.07),
                    transparent 30%
                ),

                #050505;
        }


        .login-container {

            width: 100%;
            max-width: 950px;

            display: grid;

            grid-template-columns: 0.9fr 1.1fr;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.09);

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                0 0 60px rgba(255,196,0,0.05);

            backdrop-filter: blur(20px);
        }


        /* =========================================
           LEFT SIDE
        ========================================= */

        .login-left {

            padding: 55px 45px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,196,0,0.13),
                    rgba(255,196,0,0.025)
                );

            border-right: 1px solid rgba(255,255,255,0.08);

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }


        .login-logo {

            font-size: 30px;

            font-weight: 800;

            color: white;

            letter-spacing: -1px;
        }


        .login-logo span {

            color: #ffc400;
        }


        .login-left-content {

            margin: 70px 0;
        }


        .login-label {

            display: inline-block;

            padding: 7px 12px;

            border-radius: 50px;

            background: rgba(255,196,0,0.1);

            border: 1px solid rgba(255,196,0,0.2);

            color: #ffc400;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 22px;
        }


        .login-left h1 {

            color: white;

            font-size: clamp(36px,4vw,55px);

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 22px;
        }


        .login-left h1 span {

            color: #ffc400;
        }


        .login-left p {

            color: rgba(255,255,255,0.6);

            font-size: 15px;

            line-height: 1.7;

            max-width: 380px;
        }


        .login-footer-text {

            color: rgba(255,255,255,0.4);

            font-size: 13px;
        }


        /* =========================================
           RIGHT SIDE
        ========================================= */

        .login-right {

            padding: 55px 50px;

            background: rgba(0,0,0,0.25);
        }


        .login-heading {

            margin-bottom: 35px;
        }


        .login-heading h2 {

            color: white;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .login-heading p {

            color: rgba(255,255,255,0.5);

            font-size: 14px;
        }


        /* =========================================
           FORM
        ========================================= */

        .login-form {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .login-form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .login-form-group label {

            color: rgba(255,255,255,0.65);

            font-size: 12px;

            font-weight: 600;
        }


        .login-form-group input {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.04);

            color: white;

            outline: none;

            font-size: 13px;

            transition: 0.2s ease;
        }


        .login-form-group input::placeholder {

            color: rgba(255,255,255,0.25);
        }


        .login-form-group input:focus {

            border-color: #ffc400;

            box-shadow:
                0 0 0 3px rgba(255,196,0,0.08);
        }


        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        .login-options {

            display: flex;

            justify-content: flex-end;

            margin-top: -5px;
        }


        .forgot-password {

            color: #ffc400;

            text-decoration: none;

            font-size: 12px;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-submit {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: #ffc400;

            color: #080808;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s ease;
        }


        .login-submit:hover {

            background: #ffd43b;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255,196,0,0.2);
        }


        /* =========================================
           SIGNUP LINK
        ========================================= */

        .signup-text {

            text-align: center;

            margin-top: 25px;

            color: rgba(255,255,255,0.4);

            font-size: 12px;
        }


        .signup-text a {

            color: #ffc400;

            text-decoration: none;

            font-weight: 600;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            .login-container {

                grid-template-columns: 1fr;
            }


            .login-left {

                padding: 35px 30px;

                border-right: none;

                border-bottom: 1px solid rgba(255,255,255,0.08);
            }


            .login-left-content {

                margin: 40px 0;
            }


            .login-right {

                padding: 35px 30px;
            }
        }


        @media (max-width: 500px) {

            .login-page {

                padding: 15px;
            }


            .login-left,
            .login-right {

                padding: 30px 22px;
            }
        }

    </style>

</head>


<body>


    <main class="login-page">


        <div class="login-container">


            <!-- =====================================
                 LEFT SIDE
            ====================================== -->

            <section class="login-left">


                <div class="login-logo">

                    Link<span>Up</span>

                </div>


                <div class="login-left-content">


                    <span class="login-label">

                        Welcome Back

                    </span>


                    <h1>

                        Continue building
                        <span>connections.</span>

                    </h1>


                    <p>

                        Sign in to continue discovering opportunities,
                        connecting with partners and growing your network
                        through LinkUp.

                    </p>


                </div>


                <div class="login-footer-text">

                    Brands × Events × Opportunities

                </div>


            </section>



            <!-- =====================================
                 RIGHT SIDE
            ====================================== -->

            <section class="login-right">


                <div class="login-heading">

                    <h2>

                        Welcome back

                    </h2>


                    <p>

                        Sign in to your LinkUp account.

                    </p>

                </div>



                <form class="login-form" id="loginForm">


                    <!-- EMAIL -->

                    <div class="login-form-group">

                        <label for="loginEmail">

                            Email address

                        </label>


                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="login-form-group">

                        <label for="loginPassword">

                            Password

                        </label>


                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>



                    <!-- FORGOT PASSWORD -->

                    <div class="login-options">

                        <a
                            href="#"
                            class="forgot-password"
                        >

                            Forgot password?

                        </a>

                    </div>



                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-submit"
                    >

                        Sign In →

                    </button>


                </form>



                <!-- CREATE ACCOUNT -->

                <div class="signup-text">

                    Don't have an account?

                    <a href="signin.html">

                        Create one

                    </a>

                </div>


            </section>


        </div>


    </main>



    <!-- TEMPORARY LOGIN LOGIC -->

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert(
                    "Login will be connected to the LinkUp database next!"
                );

            });

    </script>


</body>

</html>
